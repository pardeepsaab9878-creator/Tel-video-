name: Telegram Bot CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Build & Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f telegram-video-downloader-bot/requirements.txt ]; then
            pip install -r telegram-video-downloader-bot/requirements.txt
          fi

      - name: Code Syntax & Import Validation
        run: |
          # Verify that Python files compile and have no syntax errors
          python -m py_compile $(find . -name "*.py" -not -path "*/.*")

      - name: Run Test Suite
        env:
          # Use placeholder / mock values during CI test execution
          # NEVER put real production secrets in CI test configs
          BOT_TOKEN: "123456789:TESTING_MOCK_TOKEN_NOT_FOR_PRODUCTION_X"
          ADMIN_USER_ID: "123456789"
          MAX_FILE_SIZE_MB: "50"
          RATE_LIMIT_SECONDS: "5"
        run: |
          # Run pytest with coverage/verbosity
          if [ -d telegram-video-downloader-bot ]; then
            PYTHONPATH=telegram-video-downloader-bot pytest telegram-video-downloader-bot/tests -v
          else
            PYTHONPATH=. pytest tests -v
          fi
